# Configuration file for SOR Poisson solver
# Si/SiO2 system with finger gate structure
#
# New coordinate system:
# z = 0nm (surface, electrodes)
# z-axis extends in negative direction
#
# Structure:
# z = 0nm: Surface (electrodes)
# ---------------
# SiO2 (0nm to -25nm)
# ---------------
# Si  (-25nm to -70nm)
# ---------------

# Computational domain
domain:
  size: [140e-9, 100e-9, 80e-9]  # [x, y, z] in meters (140nm x 100nm x 80nm)
  grid_spacing: 1e-9  # h in meters (1nm, isotropic grid)

# Material layer structure
# z_range format: [z_max, z_min] where z_max > z_min
layers:
  - material: "SiO2"
    z_range: [0, -25e-9]  # 0nm → -25nm: Silicon oxide layer (surface side)

  - material: "Si"
    z_range: [-25e-9, -70e-9]  # -25nm → -70nm: Silicon substrate (bottom side)

# Electrode structure (multiple finger gates)
# z_position: electrode bottom position (negative value)
# Electrode extends from z_position to z=0 (surface)
electrodes:
  - name: "gate_1"
    shape: "rectangle"
    x_range: [0e-9, 30e-9]  # 0-30nm in x
    y_range: [20e-9, 80e-9]     # 20-80nm in y
    z_position: -15e-9        # Electrode bottom at z=-15nm (15nm thick: z=0 → z=-15nm)
    voltage: 0.0            # 0V

  - name: "gate_2"
    shape: "rectangle"
    x_range: [35e-9, 65e-9]  # 35-65nm in x
    y_range: [20e-9, 80e-9]  # 20-80nm in y
    z_position: -15e-9        # Electrode bottom at z=-15nm
    voltage: 0.0            # 0V

  - name: "gate_3"
    shape: "rectangle"
    x_range: [70e-9, 100e-9]  # 70-100nm in x
    y_range: [20e-9, 80e-9]  # 20-80nm in y
    z_position: -15e-9        # Electrode bottom at z=-15nm
    voltage: 0.0            # 0V

  - name: "gate_4"
    shape: "rectangle"
    x_range: [105e-9, 135e-9]  # 105-135nm in x
    y_range: [20e-9, 80e-9]  # 20-80nm in y
    z_position: -15e-9        # Electrode bottom at z=-15nm
    voltage: 0.0            # 0V

# Boundary conditions
boundary_conditions:
  z_top:
    type: "neumann"                  # Neumann boundary condition
    value: 0.0                       # dphi/dz = 0

  z_bottom:
    type: "dirichlet"                # Dirichlet boundary condition
    value: 0.0                       # dphi/dz = 0

  x_sides:
    type: "periodic"                  # or "neumann"
    value: 0.0

  y_sides:
    type: "dirichlet"                  # or "neumann"
    value: 0.0
